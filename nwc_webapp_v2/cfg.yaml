# Nowcasting Application Configuration

# Deployment mode: hpc | server | local
#   hpc    — HPC cluster with PBS/qsub job scheduler
#   server — Dedicated GPU server, run inference directly (no job scheduler)
#   local  — Local development machine, use mock data
mode: server

# Server-mode inference settings (used only when mode: server)
server:
  inference_script_path: "/home/ubuntu/projects/spatiotemporal-nowcast/spatiotemporal_forecast/scripts/webapp_predictions.py"
  conda_env: "nowcasting3.12_webapp"

# Tabs shown in the navigation bar.
# Remove any entry to hide that tab from the UI.
# Available values: realtime, wr10, wr10explorer, nowcasting, explorer, comparison, metrics, assessment
enabled_tabs:
  - realtime
  - wr10
  - wr10explorer
  - nowcasting
  - explorer
  - comparison
  - metrics
  - assessment

# Available prediction models
models:
  - ConvLSTM
  - IAM4VP
  - SPROG

# Metrics thresholds
csi_threshold: [1, 5, 10, 20, 50]

# NB: the thresholds used for FSS are the same as the CSI
# FSS window sizes (in pixels)
fss_window_sizes: [1, 5, 10, 20]

# Radar availability status files (DD-MM-YYYY-HH-MM.txt, one per 5-min interval)
radar_status:
  server_path: "/data/SITES"
  local_path: "data/SITES"

# FSS real-time assessment paths
fss:
  server_fss_root: "/data/FSS_metrics"
  local_fss_root: "data/FSS_metrics"

# HPC paths (used when running on davinci cluster)
hpc_paths:
  data_root: "/davinci-1/work/protezionecivile"
  prediction_output: "/davinci-1/work/protezionecivile/nwc_webapp/"
  real_time_pred: "/davinci-1/work/protezionecivile/nwc_webapp/real_time_results"
  archive_folder: "/davinci-1/work/protezionecivile/data"
  amv_folder: "/davinci-1/work/protezionecivile/data1/AMV"
  lk_folder: "/davinci-1/work/protezionecivile/data1/LK"

# Server paths (used when running on a dedicated GPU server without job scheduler)
server_paths:
  data_root: "/data"
  prediction_output: "/data/nwc_webapp/"
  real_time_pred: "/data/nwc_webapp/real_time_results"
  archive_folder: "/data"
  amv_folder: "/data/AMV"
  lk_folder: "/data/LK"

# Local paths (used for local development with mock data)
local_paths:
  data_root: "data"
  prediction_output: "data/predictions"
  real_time_pred: "data/predictions/real_time_pred"
  archive_folder: ""
  amv_folder: "data/AMV"
  lk_folder: "data/LK"

# Radar mask (relative to package root)
radar_mask_path: "resources/mask/mask_correct.hdf"

# Data Explorer: maximum allowed date range in hours
explorer_max_hours: 48

# Legend definitions for colormaps (relative to package root)
legends_folder: "resources/legends"

# Coordinate system and grid navigation parameters
# Source grid: Transverse Mercator projection (radar data native projection)
source_grid:
  projection: "tmerc"
  prj_lat: 42.0
  prj_lon: 12.5
  ncols: 1200
  nlines: 1400
  cOff: 600     # Column offset
  lOff: 650     # Line offset
  cRes: 1000    # Column resolution (meters)
  lRes: -1000   # Line resolution (meters, negative = north to south)

# Destination grid: Geographic lat/lon (for display on maps)
dest_grid:
  projection: "merc"
  prj_lat: 0.0
  prj_lon: 12.5
  ncols: 1200
  nlines: 1400
  minLon: 4.51987
  maxLon: 20.4801
  minLat: 35.0623
  maxLat: 47.5730

# Prediction settings
prediction:
  # Number of input timesteps
  num_input_timesteps: 12

  # Number of forecast timesteps
  num_forecast_timesteps: 12

  # Time step in minutes
  timestep_minutes: 5

# Model-specific inference configs (real_time/ and start_end/ subdirectories).
# Path is relative to cfg.yaml if not absolute.
model_configs_path: "model_configs"

# PBS/HPC settings
pbs:
  queue: "fast"
  walltime: "12:00:00"

  # Set to false to disable job submission entirely (watch-folder mode).
  # Use this when predictions are generated externally (e.g. on HPC) and
  # delivered to the predictions folder via rsync/NFS.
  submit_jobs: false

  # Path to the inference script in the spatiotemporal-nowcast repository
  inference_script_path: "/home/ubuntu/spatiotemporal-nowcast/spatiotemporal_forecast/scripts/webapp_predictions.py"

  # Legacy ED_ConvLSTM script (uses old inference code)
  ed_convlstm_script_path: "/davinci-1/work/protezionecivile/backup_old_stuff/nowcasting_OLD_TEO_CODE/nwc_test_webapp.py"

  # Conda environments for each model
  environments:
    ED_ConvLSTM: "protezionecivile"
    default: "nowcasting3.12_webapp"

# Logging
logging:
  level: "INFO"
  log_to_file: false
  log_to_console: true

# WR10 small X-band radar configuration
wr10:
  # Radar location (from HDF5 where/lat, where/lon attributes)
  radar_lat: 41.84239959716797
  radar_lon: 12.646699905395508
  # Polar scan geometry (from HDF5 dataset1/where attributes)
  n_rays: 360
  n_bins: 480
  rscale: 150.0  # meters per range bin
  # Data root: {mode}_data_root/{product}/
  server_data_root: "/data/wr10"
  local_data_root: "data/wr10"
  # Output image size (pixels) for polar→Cartesian reprojection
  img_size: 600
  products:
    SRI:
      legend: "R"
      label: "Rain Rate"
      unit: "mm/h"
    VMI:
      legend: "CZ"
      label: "Max Reflectivity"
      unit: "dBZ"
    CPI:
      legend: "CZ"
      label: "Cappi"
      unit: "dBZ"
    PPI:
      legend: "CZ"
      label: "PPI"
      unit: "dBZ"

# Radar products for the Data Explorer tab.
# 'folder' supports {data_root} which is resolved from the active paths section.
radar_products:
  SRI_adj:
    legend: "R"
    label: "Rain Rate"
    unit: "mm/h"
    folder: "{data_root}/SRI_adj"
  VMI:
    legend: "CZ"
    label: "Reflectivity"
    unit: "dBZ"
    folder: "{data_root}/VMI"
  ETM:
    legend: "ETM"
    label: "Echo Top"
    unit: "m"
    folder: "{data_root}/ETM"
  VIL:
    legend: "VIL"
    label: "VIL"
    unit: "kg/m²"
    folder: "{data_root}/VIL"
  IR_108:
    legend: "IR_Temp"
    label: "IR Temperature"
    unit: "°C"
    file_format: "tiff"
    folder: "{data_root}/IR_108"
