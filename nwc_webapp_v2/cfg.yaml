# Nowcasting Application Configuration

# Tabs shown in the navigation bar.
# Remove any entry to hide that tab from the UI.
# Available values: realtime, nowcasting, explorer, comparison, metrics
enabled_tabs:
  - realtime
  - nowcasting
  - explorer
  - comparison
  - metrics

# Available prediction models
models:
  - ConvLSTM
  - ED_ConvLSTM
  - IAM4VP
  - PredFormer
  - SPROG
  - Test

# Metrics thresholds
csi_threshold: [1, 5, 10, 20, 50]

# NB: the thresholds used for FSS are the same as the CSI
# FSS window sizes (in pixels)
fss_window_sizes: [1, 5, 10, 20]

# HPC paths (used when running on davinci cluster)
hpc_paths:
  sri_folder: "/davinci-1/work/protezionecivile/data1/SRI_adj"
  prediction_output: "/davinci-1/work/protezionecivile/nwc_webapp/"
  data_root: "/davinci-1/work/protezionecivile"
  real_time_pred: "/davinci-1/work/protezionecivile/nwc_webapp/real_time_results"

# Local paths (used for development)
local_paths:
  sri_folder: "data/mock_sri"
  prediction_output: "data/predictions"
  data_root: "data"
  real_time_pred: "data/predictions/real_time_pred"

# Radar mask (relative to package root)
radar_mask_path: "resources/mask/mask_correct.hdf"

# Data Explorer: maximum allowed date range in hours
explorer_max_hours: 48

# Legend definitions for colormaps (relative to package root)
legends_folder: "resources/legends"

# Coordinate system and grid navigation parameters
# Source grid: Transverse Mercator projection (radar data native projection)
source_grid:
  projection: "tmerc"
  prj_lat: 42.0
  prj_lon: 12.5
  ncols: 1200
  nlines: 1400
  cOff: 600     # Column offset
  lOff: 650     # Line offset
  cRes: 1000    # Column resolution (meters)
  lRes: -1000   # Line resolution (meters, negative = north to south)

# Destination grid: Geographic lat/lon (for display on maps)
dest_grid:
  projection: "merc"
  prj_lat: 0.0
  prj_lon: 12.5
  ncols: 1200
  nlines: 1400
  minLon: 4.51987
  maxLon: 20.4801
  minLat: 35.0623
  maxLat: 47.5730

# Prediction settings
prediction:
  # Number of input timesteps
  num_input_timesteps: 12

  # Number of forecast timesteps
  num_forecast_timesteps: 12

  # Time step in minutes
  timestep_minutes: 5

# Model-specific inference configs (real_time/ and start_end/ subdirectories).
# Path is relative to cfg.yaml if not absolute.
model_configs_path: "model_configs"

# PBS/HPC settings
pbs:
  queue: "fast"
  walltime: "12:00:00"

  # Set to false to disable job submission entirely (watch-folder mode).
  # Use this when predictions are generated externally (e.g. on HPC) and
  # delivered to the predictions folder via rsync/NFS.
  submit_jobs: true

  # Path to the inference script in the spatiotemporal-nowcast repository
  inference_script_path: "/davinci-1/home/guidim/spatiotemporal-nowcast_webapp/spatiotemporal-nowcast/spatiotemporal_forecast/scripts/webapp_predictions.py"

  # Legacy ED_ConvLSTM script (uses old inference code)
  ed_convlstm_script_path: "/davinci-1/work/protezionecivile/backup_old_stuff/nowcasting_OLD_TEO_CODE/nwc_test_webapp.py"

  # Conda environments for each model
  environments:
    ED_ConvLSTM: "protezionecivile"
    default: "nowcasting3.12_webapp"

# Logging
logging:
  level: "INFO"
  log_to_file: false
  log_to_console: true

# Archive data folder for radar products older than ~3 days.
# Structure: {archive_folder}/YYYY/MM/DD/{product}/{filename}
# Recent data (last ~3 days) stays in folder_hpc / folder_local defined per-product.
data_archive_folder_hpc: "/davinci-1/work/protezionecivile/data"
data_archive_folder_local: ""

# Radar products for the Data Explorer tab
radar_products:
  SRI_adj:
    legend: "R"
    label: "Rain Rate"
    unit: "mm/h"
    folder_local: "data/mock_sri"
    folder_hpc: "/davinci-1/work/protezionecivile/data1/SRI_adj"
  VMI:
    legend: "CZ"
    label: "Reflectivity"
    unit: "dBZ"
    folder_local: ""
    folder_hpc: "/davinci-1/work/protezionecivile/data1/VMI"
  ETM:
    legend: "ETM"
    label: "Echo Top"
    unit: "m"
    folder_local: ""
    folder_hpc: "/davinci-1/work/protezionecivile/data1/ETM"
  VIL:
    legend: "VIL"
    label: "VIL"
    unit: "kg/m²"
    folder_local: ""
    folder_hpc: "/davinci-1/work/protezionecivile/data1/VIL"
  IR_108:
    legend: "IR_Temp"
    label: "IR Temperature"
    unit: "°C"
    file_format: "tiff"
    folder_local: "data/mock_ir"
    folder_hpc: "/davinci-1/work/protezionecivile/data1/IR_108"