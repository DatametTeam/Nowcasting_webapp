hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
model:
  name: sprog
  is_ensemble: false
  seed: 42
  args:
    probmatching_method: cdf
    precip_thr: -15
    num_workers: 24
transforms:
  0:
    name: LogarithmicTransform
    args:
      threshold: 0.2
    adjust:
    - threshold
dataframe_strategy:
  name: from_hdf_folder_start_end
  args:
    data_folder: /davinci-1/work/protezionecivile/data
    fallback_folder: /davinci-1/work/protezionecivile/data1/SRI_adj
    datetime_format: '%d-%m-%Y-%H-%M'
    start_date: 2026-04-15 01:30
    end_date: 2026-04-15 03:30
windows_extraction_args:
  hdf_key: /dataset1/data1/data
  lead_time: 12
  wlen: 12
  stride: 1
  parallel: false
save_path: /davinci-1/work/protezionecivile/nwc_webapp/real_time_results/SPROG
save_npz: false
save_npy: true
