hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
trainings_artifacts:
  training_cfg_path: /home/ubuntu/NWC_MODELS/PredFormer/config_used.yaml
  checkpoint_path: /home/ubuntu/NWC_MODELS/PredFormer/epoch=53-CriticalSuccessIndex_10=0.23.ckpt
transforms:
  0:
    name: LogarithmicTransform
    args:
      threshold: 0.2
    adjust:
    - threshold
  1:
    name: MinMaxNormalize
    args:
      excluded_value: -9999
      input_min: 0.0
      input_max: 300.0
      output_min: 0.0
      output_max: 1.0
    adjust:
    - input_min
    - input_max
    - excluded_value
dataframe_strategy:
  name: from_hdf_folder_start_end
  args:
    data_folder: /data/nwc_webapp/data
    fallback_folder: /data/SRI_adj
    datetime_format: '%d-%m-%Y-%H-%M'
    start_date: 2026-04-15 01:30
    end_date: 2026-04-15 03:30
windows_extraction_args:
  hdf_key: /dataset1/data1/data
  lead_time: 12
  wlen: 12
  stride: 1
  parallel: false
save_path: /data/nwc_webapp/real_time_results/PredFormer
save_npz: false
save_npy: true
