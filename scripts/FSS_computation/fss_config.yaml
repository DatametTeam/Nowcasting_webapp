# FSS metrics configuration
#
# NB: the `models` list is no longer set here. It's read at runtime from
# ../../nwc_webapp_v2/cfg.yaml (single source of truth, shared with the webapp)
# so that FSS computation always matches the webapp's active models.
# `ensemble_model_name` also comes from there (nwc_webapp_v2/cfg.yaml -> fss:).

thresholds: [2, 5, 10, 25, 50]   # mm/h
scales: [1, 3, 5, 10, 20]        # pixels
lead_times: [15, 30, 45, 60]     # minutes

min_votes: 3   # ensemble predicts rain when at least this many models agree

data_folder: "/data/SRI_adj"
datetime_format: "%d-%m-%Y-%H-%M"
hdf_key: "/dataset1/data1/data"

predictions_root: "/data/nwc_webapp/real_time_results"
fss_root: "/data/FSS_metrics"
